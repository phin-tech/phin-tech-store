name: PhinTechStore
options:
  bundleIdPrefix: tech.phin
  # Matches the Xcode in use, so it does not offer to "update to recommended settings" on every regenerate.
  xcodeVersion: "26.6"
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    # The release version (`just release` tags v<this>). `just bump` sets both. Project-wide, so anything embedded
    # in the app carries the app's version and build number.
    MARKETING_VERSION: "0.5.0"
    # The build number Sparkle and App Store Connect compare: it only ever goes up.
    CURRENT_PROJECT_VERSION: "5"
packages:
  PhinTechStore:
    path: .
  # In-place updates (App/UpdateChecker.swift), for the Developer ID build only. app-release reads this version to
  # fetch the matching appcast tools.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  # The Developer ID build: notarized, published on GitHub, updated by Sparkle.
  PhinTechStore:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Resources/Art", "Resources/Fonts"]
      # Folder references, so the app finds them under Art/ and Fonts/ in its Resources.
      - path: App/Resources/Art
        type: folder
        buildPhase: resources
      - path: App/Resources/Fonts
        type: folder
        buildPhase: resources
      # Ad copy and per-app art, as of this build: the fallback for _store/content.json on apps.phin.tech.
      - path: content
        type: folder
        buildPhase: resources
    # A shared scheme, generated every time: without one, Xcode can remember a scheme that a regenerate
    # removed and then show no way to build or archive the app.
    scheme: {}
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - package: PhinTechStore
        product: PhinTechStoreKit
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.phin.store
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Phin Tech Store
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # xcodegen writes these from the properties below; Generated/ is gitignored.
    entitlements:
      path: Generated/PhinTechStore.entitlements
      properties: {}
    info:
      path: Generated/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Sparkle: the appcast is an asset of the newest GitHub release (`just appcast` uploads it), and
        # updates must be signed by the private key in op://Development/lc6wrq7lltjd47uue26cdxttzu (sparkle_private_key).
        SUFeedURL: https://github.com/phin-tech/phin-tech-store/releases/latest/download/appcast.xml
        SUPublicEDKey: 2mirghhdXOaz0RtSlgkR5MOzQxF+QkubzK9tgq8eO8U=
        SUEnableAutomaticChecks: true
        # Download and install updates without asking; they take effect at the next launch. Settings can turn it off.
        SUAutomaticallyUpdate: true
