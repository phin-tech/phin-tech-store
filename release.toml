# What app-release (`just ship` and friends) knows about PhinTechStore. Every key: src/app_release/config.py
# in https://git.phin.tech/sam/app-release. Top-level keys go before the tables.
app = "PhinTechStore"
bundle_id = "tech.phin.store"
repo = "phin-tech/phin-tech-store"
description = "A 90s-style software store for Phin Tech apps"
team_id = "J35P7AJDN7"
op_item = "op://Development/lc6wrq7lltjd47uue26cdxttzu"

# Signing and notarization secrets (APPLE_ID, TEAM_ID, APP_SPECIFIC_PASSWORD, P12 base64-encoded, P12_PASSPHRASE,
# SPARKLE_PRIVATE_KEY): Infisical Cloud, project phin-tech-store. `infisical login` on a Mac; CI signs in with OIDC.
[secrets]
provider = "infisical"
project = "ab5ef8f1-af05-4d58-875d-f0e28832d026"
environment = "prod"

# A development build, as Xcode's Run would put it there. Only devices in the team's profile (and this Mac) run it.
# One that can't be reached is skipped, and `just ship` lists it at the end.
[devices]
platform = "macos"

# `just notes patch` drafts release notes with a cheap model on OpenRouter. Its key is openrouter_api_key in the secrets
# store unless this says otherwise (another field, or an op:// reference to any item); OPENROUTER_API_KEY overrides both.
# [notes]
# api_key = "op://Private/OpenRouter API Key/credential"

# The download page, apps.phin.tech: `release` (and so `ship`) puts each release's zip there too, with the
# description above. Betas stay off it.
[downloads]
